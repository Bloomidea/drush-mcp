# drush-mcp configuration
# Copy to drush-mcp.yml in your project root or home directory.
# Or pass --config <path> to use a custom location.
# Only read when the server is started without transport/host flags (a site
# defined by CLI flags wins). Per-site blocks such as file_upload need this file.

sites:
  # Local development (DDEV, Lando, or plain Drush)
  local:
    transport: local
    command: ddev drush
    # command: lando drush
    # command: drush
    # uri: https://mysite.ddev.site

  # Production via SSH
  # production:
  #   transport: ssh
  #   host: example.com
  #   user: deploy
  #   root: /var/www/html
  #   drush: vendor/bin/drush
  #   uri: https://example.com
  #   timeout: 60

  # Docker with static container name
  # staging:
  #   transport: docker
  #   host: staging.example.com
  #   user: deploy
  #   container: drupal-web
  #   drush: vendor/bin/drush
  #   uri: https://staging.example.com
  #   timeout: 30

  # Docker with dynamic container lookup (Coolify, Swarm, etc.)
  # production:
  #   transport: docker
  #   host: example.com
  #   user: root
  #   containerFilter: "label=coolify.serviceName=myapp-web"
  #   drush: vendor/bin/drush
  #   uri: https://example.com
  #   timeout: 60

  # File upload tool settings (per-site, all optional)
  # production:
  #   transport: ssh
  #   host: example.com
  #   user: deploy
  #   root: /var/www/html
  #   uri: https://example.com   # required so drupal_file_upload returns a real URL
  #   file_upload:
  #     max_size: 10485760                # 10 MB; capped by upload_max_filesize / post_max_size
  #     allowed_extensions: [txt, md, pdf, png, jpg, sql, log, yml, json]  # replaces the default list, does not extend it
  #     default_uid: 0                    # 0 = anonymous (recommended); set a user ID for attribution
  #     destination_prefix: mcp-uploads   # default; files land in <scheme>://<prefix>/<UTC YYYY-MM>/

defaults:
  timeout: 30
  # drush: vendor/bin/drush

  # The same file_upload block, for every site that does not set its own. This
  # is the only route into a server started from CLI flags: flags discard the
  # sites above and keep only these defaults.
  #
  # allowed_extensions replaces the built-in list, it does not extend it. The
  # list gates the agent, not a person: drupal_file_attach already intersects
  # with the target field's own file_extensions, and anyone with an account can
  # upload against that same allowlist through the site's forms. Adding html or
  # htm is a decision that the site serves uploads safely (a CSP sandbox header
  # on file downloads, say); note svg is already in the built-in list and is the
  # same class of document.
  # file_upload:
  #   allowed_extensions: [txt, md, pdf, png, jpg, jpeg, gif, svg, html, htm, log, sql, json, yaml, yml, zip, tar, gz]
